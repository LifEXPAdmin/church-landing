title = "God's Churches secret scanning"

[extend]
useDefault = true

# This exact password is used only by the loopback, test-sink browser fixture.
# Both conditions must match. Other values and other files retain default rules.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact fictional mission browser fixture password"
condition = "AND"
regexTarget = "secret"
paths = ['''^scripts/qa-mission-browser\.mjs$''']
regexes = ['''^Fictional-Mission-Signup-1$''']

# This fixed UUID is a fictional idempotency key in a pure schema test.
# It authorizes no account or provider operation. Both conditions must match.
[[rules.allowlists]]
description = "Exact fictional native authenticator request UUID"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/native-auth-contracts\.test\.ts$''']
regexes = ['''^76ff5d31-9439-4d9d-8174-aec5c5dbb657$''']
