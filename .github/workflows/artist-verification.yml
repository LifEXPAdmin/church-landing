name: Artist isolated verification

on:
  workflow_dispatch:
  push:
    branches: [codex/daytime-artist-privacy-20261002]
    paths:
      - .github/workflows/artist-verification.yml
      - scripts/test-artists-isolated.mjs
      - scripts/test-platform-isolated.mjs
      - scripts/qa-artist*.mjs
      - components/platform/artist-*.tsx
      - tests/artist*.test.*

permissions:
  contents: read

concurrency:
  group: artist-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:generate
      - name: Prepare runner-only browser and PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/artist-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/artist-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/artist-browser/node_modules/playwright/package.json" >> "$GITHUB_ENV"
          echo "ARTIST_BUNDLED_CHROMIUM=1" >> "$GITHUB_ENV"
      - name: Build and verify fictional artists over local HTTPS
        run: node scripts/test-artists-isolated.mjs
      - name: Preserve fictional browser results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artist-browser-${{ github.sha }}
          path: |
            .account-test/artist-hosted-*/artist-draft-browser-*/*.png
            .account-test/artist-hosted-*/artist-draft-browser-*/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
