permissions:
  contents: read

concurrency:
  group: exchange-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXCHANGE_PROFILE: ${{ github.ref_name == 'codex/release-needs-volunteer-privacy-20261008' && 'need-volunteer' || (github.ref_name == 'codex/release-needs-incoming-progress-20261008' || github.ref_name == 'codex/needs-incoming-privacy-20261003') && 'need-incoming' || (github.ref_name == 'codex/release-my-needs-contributions-20261008' || github.ref_name == 'codex/needs-contribution-privacy-20261003') && 'need-contribution' || github.ref_name == 'codex/release-exchange-search-favorites-20261008' && 'exchange-search-favorite' || github.ref_name == 'codex/exchange-favorite-privacy-20261003' && 'exchange-favorite' || github.ref_name == 'codex/exchange-saved-search-privacy-20261003' && 'exchange-saved-search' || github.ref_name == 'codex/release-exchange-handoffs-saved-20261008' && 'exchange-handoff-saved' || github.ref_name == 'codex/exchange-saved-list-privacy-20261003' && 'exchange-saved-list' || github.ref_name == 'codex/exchange-handoff-detail-privacy-20261003' && 'exchange-handoff-detail' || github.ref_name == 'codex/release-exchange-privacy-20261008' && 'exchange-privacy' || github.ref_name == 'codex/exchange-inquiry-composer-privacy-20261003' && 'exchange-inquiry-composer' || github.ref_name == 'codex/exchange-inquiry-list-privacy-20261003' && 'exchange-inquiry-list' || github.ref_name == 'codex/exchange-defaults-privacy-20261003' && 'exchange-defaults' || (github.ref_name == 'codex/exchange-editor-bootstrap-20261003' || github.ref_name == 'codex/release-exchange-20261008') && 'exchange-bootstrap' || 'exchange' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:generate
          node scripts/patch-toolchain-depth.mjs
          node scripts/patch-next-hydration.mjs
      - name: Prepare runner-only browser and PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/exchange-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/exchange-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/exchange-browser/node_modules/playwright/package.json" >> "$GITHUB_ENV"
          chromium_path="$(node -e "console.log(require(process.argv[1]).chromium.executablePath())" "$RUNNER_TEMP/exchange-browser/node_modules/playwright")"
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Build and verify fictional Exchange over local HTTPS
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-platform-isolated.mjs "$EXCHANGE_PROFILE" 2>&1 | tee "$RUNNER_TEMP/exchange-verification.log"
      - name: Record exact source, build and complete acceptance counts
        if: always()
        env:
          EXCHANGE_RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { existsSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const sourceSha = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          assert.equal(sourceSha, process.env.GITHUB_SHA);
          const output = join(process.env.RUNNER_TEMP, "exchange-evidence");
          mkdirSync(output, { recursive: true });
          const logPath = join(process.env.RUNNER_TEMP, "exchange-verification.log");
          const lines = existsSync(logPath) ? readFileSync(logPath, "utf8").split(/\r?\n/) : [];
          // No raw exceptions, DOM, environment, signed cursors, queries or actor values.
          const safeLines = lines.filter((line) => /^(?:#|ℹ) (?:tests|suites|pass|fail|cancelled|skipped|todo) \d+$/.test(line) || /^Platform production build ID: [A-Za-z0-9_-]+$/.test(line) || /^Verified fictional server source: [a-f0-9]{40} MFA mode: (?:off|enforce)$/.test(line));
          const log = safeLines.join("\n") + "\n";
          const totals = (metric) => [...log.matchAll(new RegExp("^(?:#|ℹ) " + metric + " (\\d+)$", "gm"))].map((match) => Number(match[1]));
          const buildId = existsSync(".next/BUILD_ID") ? readFileSync(".next/BUILD_ID", "utf8").trim() : null;
          const servingIdentities = [...log.matchAll(/^Verified fictional server source: ([a-f0-9]{40}) MFA mode: (off|enforce)$/gm)].map((match) => ({ sourceSha: match[1], mode: match[2] }));
          const expectations = {
            "need-volunteer": { tests: [18, 4], browsers: { "need-volunteer-browser": [5], "need-incoming-browser": [5], "need-contribution-browser": [10], "needs-browser": [10], "need-progress-browser": [17], "need-volunteer-client": [11] } },
            "need-incoming": { tests: [18, 2], browsers: { "need-incoming-browser": [5], "need-contribution-browser": [10], "needs-browser": [10], "need-progress-browser": [17] } },
            "need-contribution": { tests: [18, 2], browsers: { "need-contribution-browser": [10], "needs-browser": [10] } },
            "exchange-saved-search": { tests: [43, 3], browsers: { "exchange-saved-search-browser": [9], "exchange-browser": [8], "exchange-saved-list-browser": [8] } },
            "exchange-favorite": { tests: [43, 4], browsers: { "exchange-favorite-browser": [8], "exchange-browser": [8], "exchange-saved-search-browser": [9], "exchange-saved-list-browser": [8] } },
            "exchange-search-favorite": { tests: [65, 8], browsers: { "exchange-favorite-browser": [8], "exchange-saved-search-browser": [9], "exchange-saved-list-browser": [8], "exchange-handoff-detail-browser": [8], "exchange-browser": [8], "exchange-inquiry-composer-browser": [11], "exchange-defaults-browser": [11], "exchange-handoff-browser": [9], "exchange-inquiry-list-browser": [10], "topic-catalogue-privacy-browser": [9], "support-index-browser": [13], "notification-integration-browser": [14] } },
            "exchange-handoff-detail": { tests: [22, 5], browsers: { "exchange-handoff-detail-browser": [8], "exchange-inquiry-composer-browser": [11], "exchange-defaults-browser": [11], "exchange-handoff-browser": [9] } },
            "exchange-saved-list": { tests: [65, 3], browsers: { "exchange-saved-list-browser": [8], "exchange-browser": [8], "exchange-handoff-detail-browser": [8] } },
            "exchange-handoff-saved": { tests: [65, 6], browsers: { "exchange-saved-list-browser": [8], "exchange-handoff-detail-browser": [8], "exchange-browser": [8], "exchange-inquiry-composer-browser": [11], "exchange-defaults-browser": [11], "exchange-handoff-browser": [9] } },
            exchange: { tests: [97, 1], browsers: { "exchange-browser": [8, 20] } },
            "exchange-bootstrap": { tests: [141, 1], browsers: { "exchange-browser": [8, 20], "exchange-handoff-browser": [9], "pantry-browser": [13] } },
            "exchange-defaults": { tests: [22, 2], browsers: { "exchange-defaults-browser": [11], "exchange-handoff-browser": [9] } },
            "exchange-inquiry-list": { tests: [22, 3], browsers: { "exchange-inquiry-list-browser": [10], "exchange-handoff-browser": [9] } },
            "exchange-inquiry-composer": { tests: [22, 4], browsers: { "exchange-inquiry-composer-browser": [11], "exchange-defaults-browser": [11], "exchange-handoff-browser": [9] } },
            "exchange-privacy": { tests: [22, 4], browsers: { "exchange-inquiry-list-browser": [10], "exchange-inquiry-composer-browser": [11], "exchange-defaults-browser": [11], "exchange-handoff-browser": [9], "topic-catalogue-privacy-browser": [9], "support-index-browser": [13], "notification-integration-browser": [14] } }
          };
          const profile = process.env.EXCHANGE_PROFILE;
          assert.ok(Object.hasOwn(expectations, profile));
          const expected = expectations[profile];
          const knownSuites = new Set(Object.values(expectations).flatMap((entry) => Object.keys(entry.browsers)));
          const fixtures = (existsSync(".account-test") ? readdirSync(".account-test") : []).filter((name) => name.startsWith(profile + "-hosted-"));
          const count = (value) => Array.isArray(value) ? value.length : null;
          const empty = (value) => Array.isArray(value) && value.length === 0;
          const browsers = [];
          for (const name of fixtures) {
            const fixture = join(".account-test", name);
            for (const directory of readdirSync(fixture)) {
              const match = /^(.*)-\d+$/.exec(directory) ?? /^(need-progress-browser|need-volunteer-client)-[A-Za-z0-9]+$/.exec(directory);
              if (!match || !knownSuites.has(match[1])) continue;
              const suite = match[1];
              const pantry = suite === "pantry-browser";
              const topic = suite === "topic-catalogue-privacy-browser";
              const support = suite === "support-index-browser";
              const notifications = suite === "notification-integration-browser";
              const progress = suite === "need-progress-browser";
              const volunteerClient = suite === "need-volunteer-client";
              const passPath = join(fixture, directory, "pass.json");
              const receiptName = topic ? "receipt.json" : support ? "result.json" : pantry ? existsSync(passPath) ? "pass.json" : "result.json" : "results.json";
              let result = null;
              try { result = JSON.parse(readFileSync(join(fixture, directory, receiptName), "utf8")); } catch {}
              // Only bounded counts/booleans are exported. Never copy private receipts.
              const standardScope = !support && !notifications && !progress && !volunteerClient;
              let detailsValid = empty(result?.errors);
              if (standardScope) detailsValid &&= result?.productionWrites === 0 && result?.externalSends === 0;
              if (pantry) detailsValid &&= existsSync(passPath);
              if (progress) {
                const hash = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
                detailsValid &&= result?.source === "components/platform/exchange-need-progress.tsx" && result?.sourceSha256 === hash("components/platform/exchange-need-progress.tsx") && result?.harnessSha256 === hash("scripts/qa-exchange-need-progress-client.mjs") && Array.isArray(result?.results) && result.results.every((entry) => entry.pass === true);
              }
              if (volunteerClient) {
                const hash = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
                const sourcePaths = ["components/platform/exchange-need-volunteers.tsx", "components/platform/exchange-need-actions.tsx", "components/platform/use-private-choice-action.tsx", "components/platform/read-visibility.ts", "lib/platform/social-client.ts", "lib/platform/exchange-need-options.ts"];
                detailsValid &&= result?.controlledForegroundScenarios === 2 && result?.externalRequests === 0 && result?.harnessSha256 === hash("scripts/qa-exchange-need-volunteer-client.mjs") && sourcePaths.every((path) => result?.sources?.[path] === hash(path)) && Array.isArray(result?.results) && result.results.every((entry) => entry.pass === true);
              }
              if (["need-volunteer-browser", "need-incoming-browser", "need-contribution-browser", "exchange-inquiry-composer-browser", "exchange-saved-list-browser", "exchange-saved-search-browser", "exchange-favorite-browser"].includes(suite)) detailsValid &&= empty(result?.layoutFailures);
              if (topic) detailsValid &&= result?.source === sourceSha && result?.buildId === buildId && empty(result?.routeErrors) && empty(result?.external) && empty(result?.writes);
              if (support) detailsValid &&= result?.fixtureOnly === true && empty(result?.externalRequests) && empty(result?.caseRequests) && Array.isArray(result?.browserWrites) && result.browserWrites.every((request) => request.foregroundActivity === true && request.method === "POST" && request.path === "/api/platform/session");
              browsers.push({
                suite,
                reportedGroups: count(result?.results),
                errorCount: count(result?.errors),
                detailsValid,
                productionWrites: standardScope ? result?.productionWrites ?? null : null,
                externalSends: standardScope ? result?.externalSends ?? null : null,
                scopeEvidence: standardScope ? "explicit-fixture-receipt" : progress || volunteerClient ? "controlled-component-with-blocked-network-and-stub-transport" : support ? "fixture-only-and-validated-browser-activity" : "guarded-runner-and-successful-suite",
                explicitPantryPass: pantry ? existsSync(passPath) : null
              });
            }
          }
          const runtimeOutcome = process.env.EXCHANGE_RUNTIME_OUTCOME;
          const report = { sourceSha, profile, buildId, servingIdentities, runtimeOutcome, complete: false, environment: "isolated-fictional", omittedLogLines: lines.filter(Boolean).length - safeLines.length, tests: totals("tests"), pass: totals("pass"), fail: totals("fail"), cancelled: totals("cancelled"), skipped: totals("skipped"), todo: totals("todo"), expectedBrowserGroups: Object.values(expected.browsers).flat().reduce((sum, value) => sum + value, 0), browsers };
          const save = () => writeFileSync(join(output, "report.json"), JSON.stringify(report, null, 2) + "\n");
          save();
          writeFileSync(join(output, "verification.log"), log);
          if (runtimeOutcome === "success") {
            assert.equal(fixtures.length, 1);
            assert.match(buildId ?? "", /^[A-Za-z0-9_-]+$/);
            assert.deepEqual([...log.matchAll(/^Platform production build ID: ([A-Za-z0-9_-]+)$/gm)].map((match) => match[1]), [buildId]);
            assert.deepEqual(servingIdentities, [{ sourceSha, mode: "off" }, { sourceSha, mode: "enforce" }]);
            assert.deepEqual(report.tests, expected.tests);
            assert.deepEqual(report.pass, expected.tests);
            for (const metric of ["fail", "cancelled", "skipped", "todo"]) assert.deepEqual(report[metric], [0, 0]);
            for (const suite of knownSuites) {
              const actual = browsers.filter((entry) => entry.suite === suite).map((entry) => entry.reportedGroups).sort((a, b) => a - b);
              assert.deepEqual(actual, expected.browsers[suite] ?? [], "Complete expected browser groups: " + suite);
            }
            assert.equal(browsers.length, Object.values(expected.browsers).reduce((sum, groups) => sum + groups.length, 0));
            assert.ok(browsers.every((entry) => entry.detailsValid));
            assert.equal(browsers.reduce((sum, entry) => sum + entry.reportedGroups, 0), report.expectedBrowserGroups);
            // Several scripts write results in finally: successful child exit plus all
            // exact receipt assertions above are required before this can become true.
            report.complete = true;
            save();
          }
          NODE
      - name: Preserve fictional browser results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exchange-browser-${{ github.sha }}
          path: |
            .account-test/need-volunteer-hosted-*/need-volunteer-browser-*/volunteers-visible-390.png
            .account-test/need-volunteer-hosted-*/need-volunteer-browser-*/volunteers-visible-320-200.png
            .account-test/need-volunteer-hosted-*/need-volunteer-browser-*/volunteers-concealed.png
            .account-test/need-volunteer-hosted-*/need-incoming-browser-*/incoming-visible-390.png
            .account-test/need-volunteer-hosted-*/need-incoming-browser-*/incoming-visible-320-200.png
            .account-test/need-volunteer-hosted-*/need-incoming-browser-*/incoming-concealed-after-revocation.png
            .account-test/need-volunteer-hosted-*/need-contribution-browser-*/contribution-390.png
            .account-test/need-volunteer-hosted-*/need-contribution-browser-*/contribution-320-200.png
            .account-test/need-volunteer-hosted-*/needs-browser-*/contributions-390.png
            .account-test/need-volunteer-hosted-*/needs-browser-*/contributions-320.png
            .account-test/need-incoming-hosted-*/need-incoming-browser-*/incoming-visible-390.png
            .account-test/need-incoming-hosted-*/need-incoming-browser-*/incoming-visible-320-200.png
            .account-test/need-incoming-hosted-*/need-incoming-browser-*/incoming-concealed-after-revocation.png
            .account-test/need-incoming-hosted-*/need-contribution-browser-*/contribution-390.png
            .account-test/need-incoming-hosted-*/need-contribution-browser-*/contribution-320-200.png
            .account-test/need-incoming-hosted-*/needs-browser-*/contributions-390.png
            .account-test/need-incoming-hosted-*/needs-browser-*/contributions-320.png
            .account-test/need-contribution-hosted-*/need-contribution-browser-*/contribution-390.png
            .account-test/need-contribution-hosted-*/need-contribution-browser-*/contribution-320-200.png
            .account-test/need-contribution-hosted-*/needs-browser-*/contributions-390.png
            .account-test/need-contribution-hosted-*/needs-browser-*/contributions-320.png
            ${{ runner.temp }}/exchange-evidence/report.json
            ${{ runner.temp }}/exchange-evidence/verification.log
            .account-test/exchange-search-favorite-hosted-*/exchange-inquiry-list-browser-*/inquiries-390.png
            .account-test/exchange-search-favorite-hosted-*/exchange-inquiry-list-browser-*/inquiries-320-enlarged.png
            .account-test/exchange-search-favorite-hosted-*/topic-catalogue-privacy-browser-*/catalogue-390-100.png
            .account-test/exchange-search-favorite-hosted-*/topic-catalogue-privacy-browser-*/catalogue-320-100.png
            .account-test/exchange-search-favorite-hosted-*/topic-catalogue-privacy-browser-*/catalogue-320-200.png
            .account-test/exchange-search-favorite-hosted-*/support-index-browser-*/requests-320-enlarged.png
            .account-test/exchange-search-favorite-hosted-*/support-index-browser-*/inbox-320-enlarged.png
            .account-test/exchange-search-favorite-hosted-*/notification-integration-browser-*/scheduled-composer-320.png
            .account-test/exchange-search-favorite-hosted-*/notification-integration-browser-*/scheduled-library-320.png
            .account-test/exchange-search-favorite-hosted-*/exchange-favorite-browser-*/favorite-390.png
            .account-test/exchange-search-favorite-hosted-*/exchange-favorite-browser-*/favorite-320-200.png
            .account-test/exchange-search-favorite-hosted-*/exchange-saved-search-browser-*/saved-search-390.png
