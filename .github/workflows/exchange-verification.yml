name: Exchange isolated verification

on:
  workflow_dispatch:
  push:
    branches:
      [
        codex/exchange-query-plans-20261003,
        codex/exchange-editor-privacy-20261003,
        codex/exchange-editor-bootstrap-20261003,
        codex/exchange-defaults-privacy-20261003,
        codex/exchange-inquiry-list-privacy-20261003,
        codex/exchange-inquiry-composer-privacy-20261003
      ]
    paths:
      - .github/workflows/exchange-verification.yml
      - app/platform/exchange/**/page.tsx
      - scripts/test-platform-isolated.mjs
      - scripts/qa-exchange-inquiry-composer-privacy-browser.mjs
      - components/platform/exchange-inquiry-composer.tsx
      - components/platform/use-private-choice-action.tsx
      - tests/exchange-inquiry-composer-privacy.test.mjs
      - tests/exchange-inquiry-composer-http.test.ts
      - scripts/qa-exchange-inquiry-list-privacy-browser.mjs
      - components/platform/exchange-inquiry-list.tsx
      - components/platform/private-read-snapshot.tsx
      - tests/private-read-snapshot.test.mjs
      - tests/exchange-inquiry-list-http.test.ts
      - scripts/qa-exchange-defaults-privacy-browser.mjs
      - components/platform/exchange-defaults-form.tsx
      - components/platform/exchange-defaults-entry.tsx
      - tests/exchange-defaults-privacy.test.mjs
      - tests/exchange-defaults-http.test.ts
      - scripts/qa-exchange-browser.mjs
      - scripts/qa-exchange-search-browser.mjs
      - scripts/qa-exchange-handoff-browser.mjs
      - scripts/qa-pantry-browser.mjs
      - components/platform/exchange-page-ui.tsx
      - components/platform/exchange-contact-entry.tsx
      - components/platform/exchange-handoff-page.tsx
      - components/platform/exchange-handoff-controls.tsx
      - components/platform/exchange-editor.tsx
      - components/platform/exchange-editor-fields.tsx
      - components/platform/exchange-photos.tsx
      - tests/exchange-editor-privacy.test.mjs
      - tests/exchange-contact-entry.test.mjs
      - tests/exchange-http.test.ts
      - lib/platform/social-client.ts
      - lib/platform/exchange-listings.ts
      - tests/exchange-listings.test.ts

permissions:
  contents: read

concurrency:
  group: exchange-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:generate
      - name: Prepare runner-only browser and PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/exchange-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/exchange-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/exchange-browser/node_modules/playwright/package.json" >> "$GITHUB_ENV"
          chromium_path="$(node -e "console.log(require(process.argv[1]).chromium.executablePath())" "$RUNNER_TEMP/exchange-browser/node_modules/playwright")"
          echo "CHROMIUM_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Build and verify fictional Exchange over local HTTPS
        run: node scripts/test-platform-isolated.mjs ${{ github.ref_name == 'codex/exchange-inquiry-composer-privacy-20261003' && 'exchange-inquiry-composer' || github.ref_name == 'codex/exchange-inquiry-list-privacy-20261003' && 'exchange-inquiry-list' || github.ref_name == 'codex/exchange-defaults-privacy-20261003' && 'exchange-defaults' || github.ref_name == 'codex/exchange-editor-bootstrap-20261003' && 'exchange-bootstrap' || 'exchange' }}
      - name: Preserve fictional browser results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exchange-browser-${{ github.sha }}
          path: |
            .account-test/exchange-hosted-*/exchange-browser-*/*.png
            .account-test/exchange-hosted-*/exchange-browser-*/results.json
            .account-test/exchange-bootstrap-hosted-*/exchange-browser-*/*.png
            .account-test/exchange-bootstrap-hosted-*/exchange-browser-*/results.json
            .account-test/exchange-bootstrap-hosted-*/exchange-browser-*/failure.txt
            .account-test/exchange-bootstrap-hosted-*/exchange-handoff-browser-*/*.png
            .account-test/exchange-bootstrap-hosted-*/exchange-handoff-browser-*/results.json
            .account-test/exchange-bootstrap-hosted-*/exchange-handoff-browser-*/failure.txt
            .account-test/exchange-bootstrap-hosted-*/pantry-browser-*/*.png
            .account-test/exchange-bootstrap-hosted-*/pantry-browser-*/pass.json
            .account-test/exchange-bootstrap-hosted-*/pantry-browser-*/result.json
            .account-test/exchange-bootstrap-hosted-*/pantry-browser-*/failure.txt
            .account-test/exchange-defaults-hosted-*/exchange-defaults-browser-*/*.png
            .account-test/exchange-defaults-hosted-*/exchange-defaults-browser-*/results.json
            .account-test/exchange-defaults-hosted-*/exchange-defaults-browser-*/failure.txt
            .account-test/exchange-defaults-hosted-*/exchange-handoff-browser-*/*.png
            .account-test/exchange-defaults-hosted-*/exchange-handoff-browser-*/results.json
            .account-test/exchange-defaults-hosted-*/exchange-handoff-browser-*/failure.txt
            .account-test/exchange-inquiry-list-hosted-*/exchange-inquiry-list-browser-*/*.png
            .account-test/exchange-inquiry-list-hosted-*/exchange-inquiry-list-browser-*/results.json
            .account-test/exchange-inquiry-list-hosted-*/exchange-inquiry-list-browser-*/failure.txt
            .account-test/exchange-inquiry-list-hosted-*/exchange-handoff-browser-*/*.png
            .account-test/exchange-inquiry-list-hosted-*/exchange-handoff-browser-*/results.json
            .account-test/exchange-inquiry-list-hosted-*/exchange-handoff-browser-*/failure.txt
            .account-test/exchange-inquiry-composer-hosted-*/exchange-inquiry-composer-browser-*/*.png
            .account-test/exchange-inquiry-composer-hosted-*/exchange-inquiry-composer-browser-*/results.json
            .account-test/exchange-inquiry-composer-hosted-*/exchange-inquiry-composer-browser-*/failure.txt
            .account-test/exchange-inquiry-composer-hosted-*/exchange-defaults-browser-*/*.png
            .account-test/exchange-inquiry-composer-hosted-*/exchange-defaults-browser-*/results.json
            .account-test/exchange-inquiry-composer-hosted-*/exchange-defaults-browser-*/failure.txt
            .account-test/exchange-inquiry-composer-hosted-*/exchange-handoff-browser-*/*.png
            .account-test/exchange-inquiry-composer-hosted-*/exchange-handoff-browser-*/results.json
            .account-test/exchange-inquiry-composer-hosted-*/exchange-handoff-browser-*/failure.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
