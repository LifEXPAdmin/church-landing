name: Mobile checks

on:
  push:
    paths:
      - 'mobile/**'
      - 'packages/shared-core/**'
      - 'tests/register.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.vercelignore'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/shared-core/**'
      - 'tests/register.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.vercelignore'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      export_platform:
        description: JavaScript/Hermes export only; no native binary or release
        type: choice
        required: true
        default: none
        options:
          - none
          - android
          - ios
          - all

permissions:
  contents: read

concurrency:
  group: mobile-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hosted ephemeral runners use their own temporary storage. The shared Mac
# continues to use its SSD/claim-guarded workspace launcher.
jobs:
  checks:
    name: Mobile ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        check: [lint, typecheck, test, 'check:boundary']
    env:
      npm_config_cache: ${{ runner.temp }}/mobile-npm-cache
      TMPDIR: ${{ runner.temp }}/mobile-tmp
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Prepare ephemeral temporary storage
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - name: Install the existing locked lint tools without lifecycle scripts
        if: matrix.check == 'lint'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the locked mobile graph without lifecycle scripts
        if: matrix.check != 'check:boundary'
        run: npm --prefix mobile ci --ignore-scripts --no-audit --no-fund
      - name: Run the selected mobile check
        env:
          MOBILE_CHECK: ${{ matrix.check }}
        run: npm --prefix mobile run "$MOBILE_CHECK"

  packages:
    name: Mobile package security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      npm_config_cache: ${{ runner.temp }}/mobile-npm-cache
      TMPDIR: ${{ runner.temp }}/mobile-tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Prepare ephemeral temporary storage
        run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - name: Install the locked mobile graph without lifecycle scripts
        id: dependencies
        run: npm --prefix mobile ci --ignore-scripts --no-audit --no-fund
      - name: Check known mobile dependency advisories
        run: npm --prefix mobile audit --audit-level=high
      - name: Verify registry signatures and provenance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm --prefix mobile audit signatures

  export:
    name: Requested JavaScript export
    if: github.event_name == 'workflow_dispatch' && inputs.export_platform != 'none'
    needs: [checks, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ runner.temp }}/mobile-npm-cache
      TMPDIR: ${{ runner.temp }}/mobile-tmp
      __UNSAFE_EXPO_HOME_DIRECTORY: ${{ runner.temp }}/mobile-expo-home
      XDG_CACHE_HOME: ${{ runner.temp }}/mobile-cache
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      APP_VARIANT: development
      EXPORT_PLATFORM: ${{ inputs.export_platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Prepare ephemeral temporary storage
        run: mkdir -p "$TMPDIR" "$npm_config_cache" "$__UNSAFE_EXPO_HOME_DIRECTORY" "$XDG_CACHE_HOME"
      - name: Install the locked mobile graph without lifecycle scripts
        run: npm --prefix mobile ci --ignore-scripts --no-audit --no-fund
      - name: Verify Expo compatibility
        working-directory: mobile
        run: npx --no-install expo install --check
      - name: Capture public source identity for this export
        working-directory: mobile
        run: node scripts/build-identity.mjs >> "$GITHUB_ENV"
      - name: Export only the requested platform
        working-directory: mobile
        shell: bash
        run: |
          case "$EXPORT_PLATFORM" in
            android|ios|all) ;;
            *) exit 1 ;;
          esac
          npx --no-install expo export --platform "$EXPORT_PLATFORM" --max-workers 1 --output-dir .generated/ci-export
          find .generated/ci-export -type f -exec sha256sum {} +
