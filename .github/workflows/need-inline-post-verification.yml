            .account-test/need-inline-post-hosted-*/need-role-browser-*/roles-selected-320-200.png
            .account-test/need-inline-post-hosted-*/need-role-browser-*/roles-revoked.png
            .account-test/need-inline-post-hosted-*/exchange-favorite-browser-*/favorite-390.png
            .account-test/need-inline-post-hosted-*/exchange-favorite-browser-*/favorite-320-200.png
            .account-test/need-inline-post-hosted-*/exchange-inquiry-composer-browser-*/composer-390.png
            .account-test/need-inline-post-hosted-*/exchange-inquiry-composer-browser-*/composer-320-200.png
