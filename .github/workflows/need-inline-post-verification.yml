            .account-test/need-inline-post-hosted-*/need-contribution-browser-*/contribution-390.png
            .account-test/need-inline-post-hosted-*/need-contribution-browser-*/contribution-320-200.png
            .account-test/need-inline-post-hosted-*/needs-browser-*/contributions-390.png
            .account-test/need-inline-post-hosted-*/needs-browser-*/contributions-320.png
