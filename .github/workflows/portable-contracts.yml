name: Portable contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GC_SHARED_CORE_TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the existing locked website graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check portable imports, named exports and frozen v1 compatibility
        run: npm run check:portable
      - name: Check the portability tooling itself
        run: npx --no-install eslint scripts/check-portability.mjs tests/portable/portability.test.mjs tests/fixtures/api-v1-initial-native-compatibility.ts
