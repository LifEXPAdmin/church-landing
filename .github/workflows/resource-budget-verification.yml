name: Resource budget isolated measurement

on:
  workflow_dispatch:
  push:
    branches: [codex/resource-budget-hosted-20261003]
    paths:
      - .github/workflows/resource-budget-verification.yml
      - scripts/test-platform-isolated.mjs
      - scripts/qa-resource-budgets.mjs
      - scripts/resource-budget-identity.mjs
      - scripts/resource-response-budget.mjs
      - tests/seed-capacity.ts
      - tests/resource-budget-fixture.ts
      - tests/resource-response-budget.test.mjs

permissions:
  contents: read

concurrency:
  group: resource-budget-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked application dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:generate
      - name: Locate runner-only PostgreSQL tooling
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Measure the current fictional dense workload
        run: node scripts/test-platform-isolated.mjs resources
      - name: Preserve aggregate measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-budgets-${{ github.sha }}
          path: |
            .account-test/resources-hosted-*/measurement-candidate.json
            .account-test/resources-hosted-*/service-budget.json
            .account-test/resources-hosted-*/http-budget.json
            .account-test/resources-hosted-*/http-budget-progress.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
