plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.gcnativejson'
version = '0.0.1'

android {
  namespace 'expo.modules.gcnativejson'
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

dependencies {
  // The selected React Native dependency already exports OkHttp/Okio.
  implementation 'com.facebook.react:react-android'
}
